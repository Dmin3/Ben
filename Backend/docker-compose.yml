services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ben
      POSTGRES_USER: ben
      POSTGRES_PASSWORD: ben
    ports:
      - "5432:5432"
    volumes:
      - ben-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ben -d ben"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - ben-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  ben-postgres:
  ben-redis:
