openapi: 3.1.0
info:
  title: BEN Backend API
  version: 1.2.0
  description: |
    BEN 사용자 인증 및 고객사 서브계정 관리 API 명세입니다.
    Access Token은 응답 본문과 HttpOnly 쿠키로, Refresh Token은 HttpOnly 쿠키로 발급됩니다.
servers:
  - url: http://localhost:3000
    description: 로컬 개발 서버

tags:
  - name: Main Auth
    description: 메인계정 가입과 로그인
  - name: Sub Auth
    description: 서브계정 로그인
  - name: OAuth
    description: Google, Kakao, Naver SSO
  - name: Session
    description: 현재 사용자와 JWT 세션
  - name: Sub Accounts
    description: 메인 OWNER의 서브계정 관리

  - name: Onboarding
    description: SSO 최초 로그인 사용자의 고객사 소속 요청
  - name: Membership Approval
    description: 고객사 MAIN OWNER의 소속 승인 관리
  - name: Factories
    description: 고객사별 거래 공장 조회와 메모 관리

paths:
  /api/deposit:
    $ref: './deposit-openapi.json#/paths/~1api~1deposit'
  /api/deposit/transactions:
    $ref: './deposit-openapi.json#/paths/~1api~1deposit~1transactions'
  /api/deposit/transactions/export:
    $ref: './deposit-openapi.json#/paths/~1api~1deposit~1transactions~1export'
  /api/deposit/alerts:
    $ref: './deposit-openapi.json#/paths/~1api~1deposit~1alerts'
  /api/deposit/invoices/{id}/download:
    $ref: './deposit-openapi.json#/paths/~1api~1deposit~1invoices~1{id}~1download'
  /api/admin/accounts/{accountId}/deposit/transactions:
    $ref: './deposit-openapi.json#/paths/~1api~1admin~1accounts~1{accountId}~1deposit~1transactions'
  /api/admin/accounts/{accountId}/deposit/transactions/{id}/reverse:
    $ref: './deposit-openapi.json#/paths/~1api~1admin~1accounts~1{accountId}~1deposit~1transactions~1{id}~1reverse'
  /api/admin/accounts/{accountId}/deposit/schedules:
    $ref: './deposit-openapi.json#/paths/~1api~1admin~1accounts~1{accountId}~1deposit~1schedules'
  /api/admin/accounts/{accountId}/deposit/schedules/{id}:
    $ref: './deposit-openapi.json#/paths/~1api~1admin~1accounts~1{accountId}~1deposit~1schedules~1{id}'
  /api/admin/accounts/{accountId}/deposit/alerts:
    $ref: './deposit-openapi.json#/paths/~1api~1admin~1accounts~1{accountId}~1deposit~1alerts'
  /api/admin/accounts/{accountId}/deposit/invoices:
    $ref: './deposit-openapi.json#/paths/~1api~1admin~1accounts~1{accountId}~1deposit~1invoices'
  /api/auth/phone/send:
    post:
      tags: [Main Auth, Sub Auth, OAuth]
      summary: SMS 인증번호 발송
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, purpose]
              properties:
                phone: { type: string, example: "01012345678" }
                purpose: { type: string, enum: [MAIN_SIGNUP, SUB_SIGNUP, SSO_SIGNUP] }
      responses:
        "202": { description: 발송 접수 }
        "429": { description: 60초 이내 재발송 제한 }

  /api/auth/phone/verify:
    post:
      tags: [Main Auth, Sub Auth, OAuth]
      summary: SMS 인증번호 확인 및 1회용 검증 토큰 발급
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, code, purpose]
              properties:
                phone: { type: string, example: '01012345678' }
                code: { type: string, pattern: '^\d{6}$' }
                purpose: { type: string, enum: [MAIN_SIGNUP, SUB_SIGNUP, SSO_SIGNUP] }
      responses:
        "200":
          description: verificationToken 발급(10분, 1회 사용)
          content:
            application/json:
              schema:
                type: object
                properties:
                  verificationToken: { type: string }
                  phone: { type: string }
                  expiresIn: { type: integer, const: 600 }
        "400": { $ref: '#/components/responses/BadRequest' }

  /api/auth/sub/register:
    post:
      tags: [Sub Auth]
      summary: 서브계정 가입 및 메인계정 승인 요청
      description: 사업자번호가 아니라 mainAccountCode로 대상 메인계정을 지정한다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mainAccountCode, email, password, name, phone, phoneVerificationToken]
              properties:
                mainAccountCode: { type: string, minLength: 3, maxLength: 30 }
                email: { type: string, format: email }
                password: { type: string, minLength: 10, maxLength: 128 }
                name: { type: string, minLength: 2, maxLength: 80 }
                phone: { type: string }
                phoneVerificationToken: { type: string, description: SUB_SIGNUP 검증 토큰 }
      responses:
        "202": { description: 가입 승인 대기 }

  /api/onboarding/main-account:
    post:
      tags: [Onboarding]
      summary: SSO 신규 사용자의 메인계정 생성
      description: SSO가 휴대폰번호를 제공하지 않은 경우 SSO_SIGNUP 검증 토큰이 필요하다.
      security:
        - onboardingCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, accountCode, accountName, businessRegistrationNumber]
              properties:
                name: { type: string, minLength: 2, maxLength: 80, description: 실명. SSO 공급자 이름 대신 저장 }
                accountCode: { type: string, minLength: 3, maxLength: 30 }
                accountName: { type: string, minLength: 2, maxLength: 100 }
                businessRegistrationNumber: { type: string }
                phone: { type: string }
                phoneVerificationToken: { type: string, description: SSO_SIGNUP 인증 토큰. 저장된 번호가 없으면 phone과 함께 필수 }
      responses:
        "201": { description: 메인계정 생성 및 로그인 }

  /api/auth/main/register:
    post:
      tags: [Main Auth]
      summary: 메인계정 및 고객사 가입
      operationId: registerMainAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MainRegisterRequest"
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/MainRegisterRequest"
      responses:
        "201":
          description: 가입 및 로그인 성공
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MainRegisterResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/auth/main/login:
    post:
      tags: [Main Auth]
      summary: 메인계정 자체 로그인
      description: 메인계정은 고객사 코드 없이 이메일과 비밀번호로 로그인합니다.
      operationId: loginMainAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MainLoginRequest"
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/MainLoginRequest"
      responses:
        "200":
          description: 로그인 성공
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/auth/sub/login:
    post:
      tags: [Sub Auth]
      summary: 서브계정 자체 로그인
      description: 고객사 코드, 고객사 내부 로그인 ID와 비밀번호가 필요합니다.
      operationId: loginSubAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubLoginRequest"
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/SubLoginRequest"
      responses:
        "200":
          description: 로그인 성공
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/auth/refresh:
    post:
      tags: [Session]
      summary: Access/Refresh Token 회전
      description: ben_refresh_token HttpOnly 쿠키가 필요하며 세션의 7일 절대 만료시간은 연장되지 않습니다.
      operationId: refreshSession
      security:
        - refreshCookie: []
      responses:
        "200":
          description: 토큰 회전 성공
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/auth/logout:
    post:
      tags: [Session]
      summary: 로그아웃
      description: Refresh Token이 유효하면 Redis 세션을 폐기하며 항상 멱등적으로 처리합니다.
      operationId: logout
      security:
        - refreshCookie: []
      responses:
        "200":
          description: 로그아웃 완료
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /api/auth/me:
    get:
      tags: [Session]
      summary: 현재 사용자와 고객사 정보 조회
      operationId: getCurrentUser
      security:
        - bearerAuth: []
        - accessCookie: []
      responses:
        "200":
          description: 현재 인증 컨텍스트
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUserResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/auth/main/oauth/{provider}/register:
    post:
      tags: [OAuth]
      security:
        - benAdminKey: []
      summary: SSO 메인계정 가입 URL 생성
      operationId: createMainOAuthRegistrationUrl
      parameters:
        - $ref: "#/components/parameters/OAuthProvider"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MainOAuthRegisterRequest"
      responses:
        "200":
          description: 외부 SSO 인증 URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorizationUrlResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/auth/main/oauth/{provider}/start:
    get:
      tags: [OAuth]
      summary: 메인계정 SSO 로그인 시작
      operationId: startMainOAuthLogin
      parameters:
        - $ref: "#/components/parameters/OAuthProvider"
      responses:
        "307": { $ref: "#/components/responses/OAuthRedirect" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/auth/sub/oauth/{provider}/start:
    get:
      tags: [OAuth]
      summary: 서브계정 SSO 로그인 시작
      operationId: startSubOAuthLogin
      parameters:
        - $ref: "#/components/parameters/OAuthProvider"
        - name: accountCode
          in: query
          required: true
          description: 로그인할 고객사 코드
          schema:
            type: string
            minLength: 3
            maxLength: 30
            example: ben
      responses:
        "307": { $ref: "#/components/responses/OAuthRedirect" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/auth/oauth/{provider}/link/start:
    get:
      tags: [OAuth]
      summary: 현재 계정에 SSO 연결 시작
      description: 자체 로그인된 계정에 SSO를 연결하고 인증 방식을 BOTH로 변경합니다.
      operationId: startOAuthLink
      security:
        - bearerAuth: []
        - accessCookie: []
      parameters:
        - $ref: "#/components/parameters/OAuthProvider"
      responses:
        "307": { $ref: "#/components/responses/OAuthRedirect" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/auth/invitations/{token}/oauth/{provider}/start:
    get:
      tags: [OAuth]
      summary: SSO 전용 서브계정 초대 수락 시작
      operationId: startInvitationOAuth
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/OAuthProvider"
      responses:
        "307": { $ref: "#/components/responses/OAuthRedirect" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "410":
          description: 만료, 취소 또는 이미 사용된 초대
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500": { $ref: "#/components/responses/InternalError" }

  /api/auth/oauth/{provider}/callback:
    get:
      tags: [OAuth]
      summary: 공통 OAuth 콜백
      description: OAuth 제공자가 호출합니다. 처리 후 FRONTEND_URL/auth/callback로 성공 또는 오류 정보를 담아 이동합니다.
      operationId: handleOAuthCallback
      parameters:
        - $ref: "#/components/parameters/OAuthProvider"
        - name: code
          in: query
          schema: { type: string }
        - name: state
          in: query
          schema: { type: string }
        - name: error
          in: query
          schema: { type: string }
      responses:
        "307":
          description: 프런트엔드 인증 결과 화면으로 이동
          headers:
            Location:
              schema: { type: string, format: uri }
            Set-Cookie:
              schema: { type: string }

  /api/accounts/sub-users:
    get:
      tags: [Sub Accounts]
      summary: 서브계정 목록 조회
      description: 현재 고객사의 메인 OWNER만 호출할 수 있습니다.
      operationId: listSubAccounts
      security:
        - bearerAuth: []
        - accessCookie: []
      responses:
        "200":
          description: 서브계정 목록
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/SubAccount"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      tags: [Sub Accounts]
      summary: 서브계정 생성
      description: |
        메인 OWNER만 호출할 수 있습니다. LOCAL_ONLY/BOTH에는 loginId와 password가 필요하고,
        SSO_ONLY/BOTH에는 provider가 필요합니다. SSO_ONLY이면 INVITED 상태와 일회용 invitationUrl을 반환합니다.
      operationId: createSubAccount
      security:
        - bearerAuth: []
        - accessCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSubAccountRequest"
      responses:
        "201":
          description: 서브계정 생성 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateSubAccountResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/accounts/sub-users/{memberId}:
    patch:
      tags: [Sub Accounts]
      summary: 서브계정 역할, 권한 또는 상태 수정
      operationId: updateSubAccount
      security:
        - bearerAuth: []
        - accessCookie: []
      parameters:
        - $ref: "#/components/parameters/MemberId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSubAccountRequest"
      responses:
        "200":
          description: 변경된 account_members 레코드
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountMember"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
    delete:
      tags: [Sub Accounts]
      summary: 서브계정 비활성화
      description: 물리 삭제하지 않고 DISABLED로 변경하며 해당 멤버의 Redis 세션을 전부 폐기합니다.
      operationId: disableSubAccount
      security:
        - bearerAuth: []
        - accessCookie: []
      parameters:
        - $ref: "#/components/parameters/MemberId"
      responses:
        "200":
          description: 비활성화 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/onboarding/me:
    get:
      tags: [Onboarding]
      summary: 소속 없는 SSO 사용자 정보 조회
      security:
        - onboardingCookie: []
      responses:
        "200":
          description: 사용자와 최근 소속 요청 상태
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OnboardingUser" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/onboarding/membership-requests:
    get:
      tags: [Onboarding]
      summary: 본인의 최근 소속 요청 조회
      security:
        - onboardingCookie: []
      responses:
        "200":
          description: 최근 요청 또는 null
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Onboarding]
      summary: 메인계정 코드로 고객사 소속 승인 요청
      description: mainAccountCode 미존재 시 404. SSO에서 번호를 받지 못했다면 SMS 인증 필요.
      security:
        - onboardingCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, mainAccountCode]
              properties:
                name: { type: string, minLength: 2, maxLength: 80, description: 실명. SSO 공급자 이름 대신 저장 }
                mainAccountCode: { type: string, example: ben }
                phone: { type: string }
                phoneVerificationToken: { type: string, description: SSO_SIGNUP 인증 토큰 }
      responses:
        "202": { description: 소속 승인 대기 요청 접수 }
        "404": { description: 대상 메인계정 없음 }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/account/membership-requests:
    get:
      tags: [Membership Approval]
      summary: 현재 고객사의 승인 대기 요청 목록
      security:
        - bearerAuth: []
        - accessCookie: []
      responses:
        "200":
          description: 승인 대기 목록
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MembershipRequestItem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/account/membership-requests/{requestId}/approve:
    post:
      tags: [Membership Approval]
      summary: 소속 요청 승인 및 SUB 멤버십 생성
      security:
        - bearerAuth: []
        - accessCookie: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200": { description: 생성된 SUB 멤버십 }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/account/membership-requests/{requestId}/reject:
    post:
      tags: [Membership Approval]
      summary: 소속 요청 거절
      security:
        - bearerAuth: []
        - accessCookie: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 500 }
      responses:
        "200": { description: 거절 처리된 요청 }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/my-info:
    get:
      tags: [My Info]
      summary: 내 정보 화면 전체 조회
      description: JWT의 고객사와 회원 정보를 기준으로 프로필, 회사, 대표 연락처, 배송지, BEN 담당자, 로그인 수단을 한 번에 반환한다.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: 내 정보 전체 데이터
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MyInfoResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/my-info/company:
    patch:
      tags: [My Info]
      summary: 고객사 회사 정보 수정
      description: MAIN/OWNER만 가능하며 사업자등록번호는 이 API로 변경할 수 없다.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CompanyUpdateRequest" }
      responses:
        "200": { description: 수정된 회사 정보 }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/my-info/contact:
    patch:
      tags: [My Info]
      summary: 고객사 대표 연락처 등록 또는 수정
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContactRequest" }
      responses:
        "200": { description: 저장된 대표 연락처 }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/my-info/addresses:
    post:
      tags: [My Info]
      summary: 배송지 추가
      description: MAIN/OWNER만 가능하며 첫 배송지는 자동으로 기본 배송지가 된다.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddressRequest" }
      responses:
        "201": { description: 생성된 배송지 }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: 배송지 최대 개수 초과 }

  /api/my-info/addresses/{addressId}:
    parameters:
      - in: path
        name: addressId
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [My Info]
      summary: 배송지 수정
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddressUpdateRequest" }
      responses:
        "200": { description: 수정된 배송지 }
        "404": { description: 배송지를 찾을 수 없음 }
    delete:
      tags: [My Info]
      summary: 배송지 삭제
      description: 기본 배송지는 삭제할 수 없다.
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: 삭제 완료 }
        "404": { description: 배송지를 찾을 수 없음 }
        "409": { description: 기본 배송지 삭제 시도 }

  /api/my-info/addresses/{addressId}/default:
    put:
      tags: [My Info]
      summary: 기본 배송지 변경
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: addressId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: 새 기본 배송지 }
        "404": { description: 배송지를 찾을 수 없음 }

  /api/my-info/password:
    patch:
      tags: [My Info]
      summary: 내 비밀번호 변경
      description: 변경 성공 시 해당 회원의 모든 세션이 폐기되어 다시 로그인해야 한다.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordChangeRequest" }
      responses:
        "200":
          description: 변경 완료 및 재로그인 필요
          content:
            application/json:
              schema:
                type: object
                required: [success, reauthRequired]
                properties:
                  success: { type: boolean, const: true }
                  reauthRequired: { type: boolean, const: true }
        "401": { description: 현재 비밀번호 불일치 }
        "409": { description: 비밀번호 로그인이 설정되지 않음 }

  /api/factories:
    get:
      tags: [Factories]
      summary: 내 거래 공장 목록 조회
      description: JWT의 accountId와 연결된 활성 공장만 검색·정렬·페이지 조회합니다.
      security: [{ bearerAuth: [] }, { accessCookie: [] }]
      parameters:
        - { in: query, name: q, schema: { type: string, maxLength: 100 } }
        - { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
        - { in: query, name: size, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
        - { in: query, name: sort, schema: { type: string, enum: [name, deals, amount, onTimeRate, defectRate, avgLeadDays], default: name } }
        - { in: query, name: direction, schema: { type: string, enum: [asc, desc], default: asc } }
      responses:
        "200": { description: 공장 목록, content: { application/json: { schema: { $ref: "#/components/schemas/FactoryListResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/factories/options:
    get:
      tags: [Factories]
      summary: 새 오더용 공장 선택 목록
      security: [{ bearerAuth: [] }, { accessCookie: [] }]
      responses:
        "200": { description: 공장 선택 옵션, content: { application/json: { schema: { $ref: "#/components/schemas/FactoryOptionListResponse" } } } }

  /api/factories/{factoryId}:
    get:
      tags: [Factories]
      summary: 공장 상세 및 통계 조회
      security: [{ bearerAuth: [] }, { accessCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/FactoryId" }]
      responses:
        "200": { description: "공장 기본정보, 고객사별 통계와 차트", content: { application/json: { schema: { $ref: "#/components/schemas/FactoryDetailResponse" } } } }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/factories/{factoryId}/memo:
    patch:
      tags: [Factories]
      summary: 고객사 전용 공장 메모 수정
      description: OWNER 또는 ADMIN만 수정할 수 있고 다른 고객사에는 노출되지 않습니다.
      security: [{ bearerAuth: [] }, { accessCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/FactoryId" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/FactoryMemoRequest" } } }
      responses:
        "200": { description: 저장된 메모 }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/factories/{factoryId}/issues:
    get:
      tags: [Factories]
      summary: 고객사별 공장 이슈 목록
      security: [{ bearerAuth: [] }, { accessCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/FactoryId" }]
      responses:
        "200": { description: 납기·불량·기타 이슈, content: { application/json: { schema: { $ref: "#/components/schemas/FactoryIssueListResponse" } } } }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/factories/{factoryId}/files:
    get:
      tags: [Factories]
      summary: 접근 가능한 공장 파일 목록
      description: 공용 파일과 현재 고객사 전용 파일만 반환합니다.
      security: [{ bearerAuth: [] }, { accessCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/FactoryId" }]
      responses:
        "200": { description: 파일 메타데이터, content: { application/json: { schema: { $ref: "#/components/schemas/FactoryFileListResponse" } } } }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    accessCookie:
      type: apiKey
      in: cookie
      name: ben_access_token
    refreshCookie:
      type: apiKey
      in: cookie
      name: ben_refresh_token
    onboardingCookie:
      type: apiKey
      in: cookie
      name: ben_onboarding_token
    benAdminKey:
      type: apiKey
      in: header
      name: x-ben-admin-key

  parameters:
    OAuthProvider:
      name: provider
      in: path
      required: true
      schema:
        type: string
        enum: [google, kakao, naver]
    MemberId:
      name: memberId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RequestId:
      name: requestId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    FactoryId:
      name: factoryId
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    OAuthRedirect:
      description: OAuth 제공자의 로그인 화면으로 이동
      headers:
        Location:
          schema: { type: string, format: uri }
    BadRequest:
      description: 요청 형식 또는 값 오류
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Unauthorized:
      description: 인증 실패 또는 세션 만료
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Forbidden:
      description: 비활성 계정, 인증 방식 불일치 또는 권한 없음
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    NotFound:
      description: 리소스 또는 OAuth 제공자를 찾을 수 없음
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Conflict:
      description: 이메일, 고객사 코드, 로그인 ID 또는 계정 연결 중복
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    InternalError:
      description: 서버 내부 오류
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }

  schemas:
    MembershipRequestStatus:
      type: object
      required: [id, status]
      properties:
        id: { type: string, format: uuid }
        status:
          type: string
          enum: [PENDING, APPROVED, REJECTED, CANCELLED, UNMATCHED]
    OnboardingUser:
      type: object
      required: [id, name, membershipRequest]
      properties:
        id: { type: string, format: uuid }
        email: { type: [string, "null"], format: email }
        name: { type: string }
        membershipRequest:
          oneOf:
            - { $ref: "#/components/schemas/MembershipRequestStatus" }
            - { type: "null" }
    MembershipRequestItem:
      type: object
      required: [id, userId, name, status, requestedAt]
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        name: { type: string }
        email: { type: [string, "null"], format: email }
        status: { type: string, const: PENDING }
        requestedAt: { type: string, format: date-time }

    MemberType:
      type: string
      enum: [MAIN, SUB]
    MemberRole:
      type: string
      enum: [OWNER, ADMIN, MEMBER]
    MemberStatus:
      type: string
      enum: [ACTIVE, INVITED, DISABLED]
    AuthMethod:
      type: string
      enum: [LOCAL_ONLY, SSO_ONLY, BOTH]
    OAuthProviderUpper:
      type: string
      enum: [GOOGLE, KAKAO, NAVER]

    MainRegisterRequest:
      type: object
      required: [accountCode, email, password, name, accountName, businessRegistrationNumber, phone, phoneVerificationToken]
      properties:
        phone: { type: string, example: "01012345678" }
        phoneVerificationToken: { type: string, description: MAIN_SIGNUP SMS 인증 후 받은 1회용 토큰 }
        accountCode:
          type: string
          pattern: "^[a-zA-Z0-9-]+$"
          minLength: 3
          maxLength: 30
          example: ben
        email:
          type: string
          format: email
          example: owner@ben-logistics.com
        password:
          type: string
          format: password
          minLength: 10
          maxLength: 128
        name:
          type: string
          minLength: 2
          maxLength: 80
          example: 홍길동
        accountName:
          type: string
          minLength: 2
          maxLength: 100
          example: 벤로지스틱스

        businessRegistrationNumber:
          type: string
          example: "123-45-67890"

    MainLoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 128

    SubLoginRequest:
      type: object
      required: [accountCode, loginId, password]
      properties:
        accountCode:
          type: string
          minLength: 3
          maxLength: 30
          example: ben
        loginId:
          type: string
          minLength: 3
          maxLength: 120
          example: test
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 128

    MainOAuthRegisterRequest:
      type: object
      required: [accountCode, accountName, businessRegistrationNumber]
      properties:
        accountCode:
          type: string
          pattern: "^[a-zA-Z0-9-]+$"
          minLength: 3
          maxLength: 30
          example: ben
        accountName:
          type: string
          minLength: 2
          maxLength: 100
          example: 벤로지스틱스

        businessRegistrationNumber:
          type: string
          example: "123-45-67890"

    CreateSubAccountRequest:
      type: object
      required: [name, email]
      properties:
        loginId:
          type: string
          pattern: "^[a-zA-Z0-9._@-]+$"
          minLength: 3
          maxLength: 80
          example: test
        password:
          type: string
          format: password
          minLength: 10
          maxLength: 128
        name:
          type: string
          minLength: 2
          maxLength: 80
          example: 테스트 사용자
        email:
          type: string
          format: email
          example: test@ben-logistics.com
        role:
          type: string
          enum: [ADMIN, MEMBER]
          default: MEMBER
        permissions:
          type: array
          maxItems: 100
          default: []
          items:
            type: string
            minLength: 1
            maxLength: 80
        authMethod:
          allOf:
            - $ref: "#/components/schemas/AuthMethod"
          default: SSO_ONLY
        provider:
          $ref: "#/components/schemas/OAuthProviderUpper"

    UpdateSubAccountRequest:
      type: object
      minProperties: 1
      properties:
        role:
          type: string
          enum: [ADMIN, MEMBER]
        permissions:
          type: array
          maxItems: 100
          items:
            type: string
            minLength: 1
            maxLength: 80
        status:
          type: string
          enum: [ACTIVE, DISABLED]

    AccountSummary:
      type: object
      required: [id, memberType, role]
      properties:
        id: { type: string, format: uuid }
        code:
          type: string
          example: ben
        memberType:
          $ref: "#/components/schemas/MemberType"
        role:
          $ref: "#/components/schemas/MemberRole"

    AuthResponse:
      type: object
      required: [accessToken, expiresAt, account]
      properties:
        accessToken: { type: string }
        expiresAt:
          type: integer
          format: int64
          description: Access Token 만료 Unix timestamp(초)
        account:
          $ref: "#/components/schemas/AccountSummary"

    MainRegisterResponse:
      allOf:
        - $ref: "#/components/schemas/AuthResponse"

    TokenResponse:
      type: object
      required: [accessToken, expiresAt]
      properties:
        accessToken: { type: string }
        expiresAt:
          type: integer
          format: int64

    AuthorizationUrlResponse:
      type: object
      required: [authorizationUrl]
      properties:
        authorizationUrl:
          type: string
          format: uri

    CurrentUserResponse:
      type: object
      required: [userId, name, accountId, accountCode, accountName, memberId, memberType, role, permissions]
      properties:
        userId: { type: string, format: uuid }
        email:
          type: [string, "null"]
          format: email
        name: { type: string }
        profileImageUrl:
          type: [string, "null"]
          format: uri
        accountId: { type: string, format: uuid }
        accountCode: { type: string }
        accountName: { type: string }
        memberId: { type: string, format: uuid }
        memberType:
          $ref: "#/components/schemas/MemberType"
        role:
          $ref: "#/components/schemas/MemberRole"
        permissions:
          type: array
          items: { type: string }

    SubAccount:
      type: object
      required: [id, userId, name, email, role, authMethod, status, permissions, createdAt]
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        loginId:
          type: [string, "null"]
        name: { type: string }
        email:
          type: [string, "null"]
          format: email
        role:
          $ref: "#/components/schemas/MemberRole"
        authMethod:
          $ref: "#/components/schemas/AuthMethod"
        ssoProvider:
          oneOf:
            - $ref: "#/components/schemas/OAuthProviderUpper"
            - type: "null"
        status:
          $ref: "#/components/schemas/MemberStatus"
        permissions:
          type: array
          items: { type: string }
        createdAt:
          type: string
          format: date-time

    CreateSubAccountResponse:
      type: object
      required: [id, userId, loginId, name, role, authMethod, status, invitationUrl]
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        loginId:
          type: [string, "null"]
        name: { type: string }
        role:
          $ref: "#/components/schemas/MemberRole"
        authMethod:
          $ref: "#/components/schemas/AuthMethod"
        status:
          $ref: "#/components/schemas/MemberStatus"
        invitationUrl:
          type: [string, "null"]
          format: uri

    AccountMember:
      type: object
      properties:
        id: { type: string, format: uuid }
        accountId: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        type:
          $ref: "#/components/schemas/MemberType"
        role:
          $ref: "#/components/schemas/MemberRole"
        authMethod:
          $ref: "#/components/schemas/AuthMethod"
        ssoProvider:
          oneOf:
            - $ref: "#/components/schemas/OAuthProviderUpper"
            - type: "null"
        status:
          $ref: "#/components/schemas/MemberStatus"
        permissions:
          type: array
          items: { type: string }
        createdByUserId:
          type: [string, "null"]
          format: uuid
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CompanyUpdateRequest:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 160 }
        nameEn: { type: [string, "null"], minLength: 1, maxLength: 160 }
        ceoName: { type: [string, "null"], minLength: 1, maxLength: 80 }
        businessType: { type: [string, "null"], minLength: 1, maxLength: 160 }
        address: { type: [string, "null"], minLength: 1, maxLength: 500 }

    ContactRequest:
      type: object
      additionalProperties: false
      required: [name, title, phone, email]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        title: { type: string, minLength: 1, maxLength: 80 }
        phone: { type: string, pattern: '^0\d{1,2}-\d{3,4}-\d{4}$' }
        email: { type: string, format: email, maxLength: 254 }

    AddressRequest:
      type: object
      additionalProperties: false
      required: [name, address, recipient, phone]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        address: { type: string, minLength: 1, maxLength: 500 }
        recipient: { type: string, minLength: 1, maxLength: 80 }
        phone: { type: string, pattern: '^0\d{1,2}-\d{3,4}-\d{4}$' }

    AddressUpdateRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        address: { type: string, minLength: 1, maxLength: 500 }
        recipient: { type: string, minLength: 1, maxLength: 80 }
        phone: { type: string, pattern: '^0\d{1,2}-\d{3,4}-\d{4}$' }

    PasswordChangeRequest:
      type: object
      additionalProperties: false
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string, minLength: 1, maxLength: 128, writeOnly: true }
        newPassword: { type: string, minLength: 10, maxLength: 128, writeOnly: true }

    MyInfoResponse:
      type: object
      required: [profile, company, contact, addresses, benManager, account, capabilities]
      properties:
        profile:
          type: object
          required: [userId, name, companyName, customerNo, joinedAt, memberType, role]
          properties:
            userId: { type: string, format: uuid }
            name: { type: string }
            email: { type: [string, "null"], format: email }
            profileImageUrl: { type: [string, "null"], format: uri }
            companyName: { type: string }
            customerNo: { type: string }
            joinedAt: { type: string, format: date-time }
            memberType: { $ref: "#/components/schemas/MemberType" }
            role: { $ref: "#/components/schemas/MemberRole" }
        company:
          type: object
          required: [name, nameEn, businessNo, ceoName, businessType, address, certificate]
          properties:
            name: { type: string }
            nameEn: { type: [string, "null"] }
            businessNo:
              type: [string, "null"]
              description: 보안을 위해 마스킹된 사업자등록번호
              example: "***-**-*7890"
            ceoName: { type: [string, "null"] }
            businessType: { type: [string, "null"] }
            address: { type: [string, "null"] }
            certificate:
              type: "null"
              description: 파일 저장소 연동 전까지 null
        contact:
          oneOf:
            - $ref: "#/components/schemas/ContactRequest"
            - type: "null"
        addresses:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/AddressRequest"
              - type: object
                required: [id, isDefault]
                properties:
                  id: { type: string, format: uuid }
                  isDefault: { type: boolean }
        benManager:
          type: [object, "null"]
          properties:
            name: { type: string }
            email: { type: [string, "null"], format: email }
            title: { type: string }
            phone: { type: [string, "null"] }
            description: { type: [string, "null"] }
        account:
          type: object
          required: [loginId, authMethod, linkedProviders, canChangePassword]
          properties:
            loginId: { type: [string, "null"] }
            authMethod: { $ref: "#/components/schemas/AuthMethod" }
            linkedProviders:
              type: array
              items:
                type: object
                required: [provider, email, linkedAt]
                properties:
                  provider: { $ref: "#/components/schemas/OAuthProviderUpper" }
                  email: { type: [string, "null"], format: email }
                  linkedAt: { type: string, format: date-time }
            canChangePassword: { type: boolean }
        capabilities:
          type: object
          required: [canEditCompany, canEditContact, canManageAddresses, canChangePassword]
          properties:
            canEditCompany: { type: boolean }
            canEditContact: { type: boolean }
            canManageAddresses: { type: boolean }
            canChangePassword: { type: boolean }

    FactoryGrade:
      type: string
      enum: [excellent, good]

    FactoryMetrics:
      type: object
      required: [deals, totalAmount, onTimeRate, defectRate, avgLeadDays]
      properties:
        deals: { type: integer, minimum: 0 }
        totalAmount: { type: number, minimum: 0, description: 누적 발주금액 CNY }
        onTimeRate: { type: number, minimum: 0, maximum: 100 }
        defectRate: { type: number, minimum: 0, maximum: 100 }
        avgLeadDays: { type: integer, minimum: 0 }
        calculatedAt: { type: [string, "null"], format: date-time }

    FactoryListItem:
      allOf:
        - $ref: "#/components/schemas/FactoryMetrics"
        - type: object
          required: [id, code, name, grade, category, region, tags]
          properties:
            id: { type: string, format: uuid }
            code: { type: string }
            name: { type: string }
            grade: { $ref: "#/components/schemas/FactoryGrade" }
            category: { type: string }
            region: { type: string }
            photoUrl: { type: [string, "null"], format: uri }
            tags: { type: array, items: { type: string } }

    FactoryListResponse:
      type: object
      required: [items, pagination]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/FactoryListItem" } }
        pagination:
          type: object
          required: [page, size, total, totalPages]
          properties:
            page: { type: integer }
            size: { type: integer }
            total: { type: integer }
            totalPages: { type: integer }

    FactoryDetailResponse:
      type: object
      required: [factory, metrics, yearly, categoryShare, capabilities]
      properties:
        factory:
          type: object
          required: [id, code, name, countryCode, region, address, category, grade, tags]
          properties:
            id: { type: string, format: uuid }
            code: { type: string }
            name: { type: string }
            legalName: { type: [string, "null"] }
            countryCode: { type: string, minLength: 2, maxLength: 2 }
            region: { type: string }
            address: { type: string }
            manager: { type: [string, "null"] }
            category: { type: string }
            grade: { $ref: "#/components/schemas/FactoryGrade" }
            photoUrl: { type: [string, "null"], format: uri }
            tags: { type: array, items: { type: string } }
            memo: { type: [string, "null"] }
            firstOrderAt: { type: [string, "null"], format: date-time }
            lastOrderAt: { type: [string, "null"], format: date-time }
        metrics: { $ref: "#/components/schemas/FactoryMetrics" }
        yearly:
          type: array
          items:
            type: object
            required: [year, deals, amount]
            properties:
              year: { type: integer }
              deals: { type: integer }
              amount: { type: number }
        categoryShare:
          type: array
          items:
            type: object
            required: [name, deals]
            properties:
              name: { type: string }
              deals: { type: integer }
        capabilities:
          type: object
          required: [canEditMemo]
          properties: { canEditMemo: { type: boolean } }

    FactoryMemoRequest:
      type: object
      additionalProperties: false
      required: [memo]
      properties: { memo: { type: [string, "null"], maxLength: 2000 } }

    FactoryIssueListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [id, type, title, occurredAt, resolved]
            properties:
              id: { type: string, format: uuid }
              type: { type: string, enum: [delay, defect, etc] }
              title: { type: string }
              orderCode: { type: [string, "null"] }
              occurredAt: { type: string, format: date-time }
              resolved: { type: boolean }
              resolvedAt: { type: [string, "null"], format: date-time }

    FactoryFileListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [id, name, contentType, sizeBytes, createdAt]
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
              contentType: { type: string }
              sizeBytes: { type: integer }
              createdAt: { type: string, format: date-time }

    FactoryOptionListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [value, name, description, history]
            properties:
              value: { type: string, format: uuid }
              name: { type: string }
              description: { type: string }
              history: { type: integer }

    SuccessResponse:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
          example: true

    ErrorDetail:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: VALIDATION_ERROR
        message:
          type: string
          example: 요청 값이 올바르지 않습니다.
        details:
          type: object
          additionalProperties: true

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/ErrorDetail"
